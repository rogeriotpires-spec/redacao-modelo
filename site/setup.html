<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instalação</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f2ee;font:15px/1.5 system-ui,sans-serif;padding:16px;color:#0b0b0b}
.box{width:100%;max-width:420px;background:#fff;border:1px solid #e3e1da;border-radius:18px;padding:26px 22px}
h1{font-size:22px;margin:0 0 6px}p{color:#52514e;font-size:14px;margin:0 0 16px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#52514e;margin-bottom:12px}
input{font:16px system-ui,sans-serif;padding:10px 12px;border:1px solid #e3e1da;border-radius:10px}
button{width:100%;font:700 15px system-ui,sans-serif;padding:12px;border:0;border-radius:10px;background:#0b3d91;color:#fff;cursor:pointer}
.err{color:#b4302f;font-size:13px;min-height:1.2em}.ok{color:#0f7a4c}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>Primeiro acesso</h1>
  <p>Crie o administrador desta redação. Esta tela só funciona uma vez, enquanto não existe nenhum usuário, e pede o código de instalação.</p>
  <label>Código de instalação<input name="token" required></label>
  <label>Seu nome<input name="nome" required></label>
  <label>Usuário (letras minúsculas, sem espaço)<input name="login" autocapitalize="none" required></label>
  <label>Senha (mínimo 8 caracteres)<input name="senha" type="password" minlength="8" autocomplete="new-password" required></label>
  <button>Criar administrador</button>
  <p class="err" id="e" role="alert"></p>
</form>
<script>
const f=document.getElementById("f"),e=document.getElementById("e");
f.onsubmit=async ev=>{ev.preventDefault();e.textContent="";e.className="err";
  const r=await fetch("/api/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:f.token.value.trim(),nome:f.nome.value.trim(),login:f.login.value.trim().toLowerCase(),senha:f.senha.value})});
  const j=await r.json().catch(()=>({}));if(!r.ok){e.textContent=j.error||"Erro.";return}
  e.className="err ok";e.textContent="Administrador criado. Indo para o login…";setTimeout(()=>location.href="/login.html",1200)};
</script>
</body>
</html>
