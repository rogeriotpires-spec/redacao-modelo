<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ee;--surface:#fcfcfb;--border:#e3e1da;--text:#0b0b0b;--text-2:#52514e;--muted:#85847e;--bad:#b4302f;--marca:#0b3d91;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--surface:#1a1a19;--border:#2f2f2c;--text:#fff;--text-2:#c3c2b7;--muted:#8f8e86;--bad:#ef7b7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--surface:#1a1a19;--border:#2f2f2c;--text:#fff;--text-2:#c3c2b7;--muted:#8f8e86;--bad:#ef7b7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.eb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:700 26px/1.15 Fraunces,Georgia,serif;margin:6px 0 18px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:12px}
input{font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--marca);outline-offset:1px}
button{width:100%;font:700 15px Inter,sans-serif;padding:12px;border:0;border-radius:10px;background:var(--marca);color:#fff;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:8px 0 0}
.rod{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="eb" id="cli">Redação Inteligente</div>
  <h1>Entrar</h1>
  <label>Usuário<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
  <button id="b">Entrar</button>
  <p class="err" id="e" role="alert"></p>
  <p class="rod">Esqueceu a senha? Peça ao administrador da sua redação para criar uma nova.</p>
</form>
<script>
fetch("/cliente.json").then(r=>r.json()).then(c=>{const k=c.cores||{primaria:c.cor};if(k.primaria)document.documentElement.style.setProperty("--marca",k.primaria);if(c.logo){const im=new Image();im.src="/"+c.logo+"?v="+(c.versao||"");im.alt=c.veiculo||"";im.style.cssText="display:block;max-height:64px;max-width:220px;margin:0 0 16px";im.onerror=()=>im.remove();document.getElementById("cli").before(im)}document.getElementById("cli").textContent=[c.produto,c.veiculo].filter(Boolean).join(" · ");document.title="Entrar · "+(c.veiculo||c.produto||"")}).catch(()=>{});
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.onsubmit=async ev=>{ev.preventDefault();e.textContent="";b.disabled=true;
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:f.login.value.trim().toLowerCase(),senha:f.senha.value})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Não foi possível entrar.");
    const n=new URLSearchParams(location.search).get("next");location.href=n&&n.startsWith("/")&&!n.startsWith("//")?n:"/";
  }catch(err){e.textContent=err.message;b.disabled=false}};
</script>
</body>
</html>
